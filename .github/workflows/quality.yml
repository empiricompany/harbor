name: Quality

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install shell tools
              run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
            - name: Check shell scripts
              run: |
                  shellcheck bin/harbor tests/harbor.sh
                  shfmt -d bin/harbor tests/harbor.sh
                  bash -n bin/harbor tests/harbor.sh
            - name: Run Bash tests
              run: bash tests/harbor.sh
            - name: Validate YAML
              run: |
                  for file in resources/stubs/*.yaml; do
                      ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file"
                  done
