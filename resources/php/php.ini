error_reporting = E_ALL
display_errors = On
display_startup_errors = On
; Also write PHP errors to stderr, so `harbor logs app` shows them next to the
; Caddy access log. /proc/self/fd/2 is the container's stderr. Errors are still
; displayed in the response (display_errors) for developer mode.
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 512M
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
sendmail_path = "/usr/local/bin/harbor-sendmail -t"

ffi.enable = true

xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log = /tmp/xdebug.log
