services:
  adminer:
    image: adminer:latest
    profiles: [adminer]
    environment:
      # The adminer image only supports ADMINER_DEFAULT_SERVER: the login
      # server field is pre-filled, user/password/db must be entered manually.
      ADMINER_DEFAULT_SERVER: "${HARBOR_DB_HOST}"
    ports:
      - "${HARBOR_ADMINER_PORT:-8082}:8080"
    networks:
      - harbor
