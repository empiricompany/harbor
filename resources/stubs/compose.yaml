name: '${HARBOR_PROJECT_NAME:-harbor}'
services:
  app:
    build:
      context: __HARBOR_PACKAGE_ROOT__
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: '${HARBOR_PHP_VERSION:-8.4}'
        DEBIAN_VARIANT: '${HARBOR_DEBIAN_VARIANT:-trixie}'
        HARBOR_PHP_EXTENSIONS: '${HARBOR_PHP_EXTENSIONS:-}'
        MAHO_UID: '${HARBOR_UID:-1000}'
        MAHO_GID: '${HARBOR_GID:-1000}'
    image: 'maho-harbor/${HARBOR_PROJECT_NAME:-harbor}:app-php${HARBOR_PHP_VERSION:-8.4}-trixie'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - '-k'
        - '-f'
        - '-sS'
        - '-o'
        - /dev/null
        - 'https://localhost:${HARBOR_APP_PORT:-8443}/.harbor/health'
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      MAHO_HARBOR: '1'
      SERVER_NAME: 'https://localhost:${HARBOR_APP_PORT:-8443}'
      SERVER_ROOT: public/
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${HARBOR_APP_PORT:-8443}:${HARBOR_APP_PORT:-8443}'
    volumes:
      - '../:/app'
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.maho-cron-always.schedule: '@every 1m'
      ofelia.job-exec.maho-cron-always.command: "sh -c 'cd /app && ./maho cron:run always'"
      ofelia.job-exec.maho-cron-always.user: maho
      ofelia.job-exec.maho-cron-always.no-overlap: 'true'
      ofelia.job-exec.maho-cron-default.schedule: '@every 5m'
      ofelia.job-exec.maho-cron-default.command: "sh -c 'cd /app && ./maho cron:run default'"
      ofelia.job-exec.maho-cron-default.user: maho
      ofelia.job-exec.maho-cron-default.no-overlap: 'true'
    networks:
      - harbor
  db:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: '${HARBOR_DB_NAME}'
      MYSQL_USER: '${HARBOR_DB_USER}'
      MYSQL_PASSWORD: '${HARBOR_DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${HARBOR_DB_ROOT_PASSWORD}'
    ports:
      - '127.0.0.1:${HARBOR_MYSQL_PORT:-3306}:3306'
    volumes:
      - 'harbor-db-data:/var/lib/mysql'
      - '__HARBOR_PACKAGE_ROOT__/resources/mysql/server.cnf:/etc/mysql/conf.d/server.cnf:ro'
      - '__HARBOR_PACKAGE_ROOT__/resources/mysql/client.cnf:/etc/mysql/conf.d/client.cnf:ro'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - localhost
        - '-p${HARBOR_DB_ROOT_PASSWORD}'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - harbor
  cron:
    image: 'mcuadros/ofelia:0.3.16'
    command:
      - daemon
      - '--docker'
      - '-f'
      - 'label=com.docker.compose.project=${HARBOR_PROJECT_NAME:-harbor}'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - harbor
  mailpit:
    image: 'axllent/mailpit:v1.21.8'
    ports:
      - '${HARBOR_MAILPIT_PORT:-8025}:8025'
      - '${HARBOR_MAILPIT_SMTP_PORT:-1025}:1025'
    networks:
      - harbor
  adminer:
    image: 'adminer:4'
    profiles:
      - adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '${HARBOR_ADMINER_PORT:-8082}:8080'
    networks:
      - harbor
  phpmyadmin:
    image: 'phpmyadmin:5.2'
    profiles:
      - phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - '${HARBOR_PHPMYADMIN_PORT:-8081}:80'
    networks:
      - harbor
  redis:
    image: 'redis:7.4'
    command: 'redis-server --maxmemory-policy volatile-lfu'
    restart: unless-stopped
    tmpfs:
      - /data
    networks:
      - harbor
volumes:
  harbor-db-data: null
networks:
  harbor:
    driver: bridge
